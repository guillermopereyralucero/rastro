version: 2

models:
  - name: mart_generacion_horaria
    description: >
      Generacion electrica peninsular por hora, con el porcentaje renovable. Es lo
      que consume el dashboard publico. Solo horas completas.

    columns:
      - name: hora
        data_tests:
          - not_null

      - name: potencia_total_mw
        description: Suma de la potencia media de todas las tecnologias de generacion.
        data_tests:
          - not_null

      - name: tecnologias
        description: Cuantas tecnologias de generacion aportaron datos en esa hora.
        data_tests: [not_null]

      - name: tecnologias_esperadas
        description: Cuantas declara el seed. Si no coinciden, falta ingerir algo.
        data_tests: [not_null]

      - name: cobertura_completa
        description: >
          Estan todas las tecnologias de generacion. Cuando es falso, el
          porcentaje renovable sale nulo a proposito.
        data_tests: [not_null]

      - name: porcentaje_renovable
        description: >
          Entre 0 y 100, y NULO cuando la cobertura no esta completa. No lleva
          `not_null`: el nulo es el comportamiento correcto mientras falten
          tecnologias por ingerir, y poner `not_null` obligaria a publicar un
          numero que no se sostiene.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 100

      - name: demanda_mw
        description: >
          Demanda real peninsular de la misma hora (indicador 1293). Esta aqui para
          que el informe pueda graficar generacion contra demanda sin combinar dos
          fuentes de datos.

      - name: razon_generacion_demanda
        description: >
          Generacion dividida por demanda. Por encima de 1 se exporta o se bombea;
          por debajo, se importa. Entre 0,5 y 2,5 es margen amplio a proposito: es
          el indicador que detecto el doble conteo del solar, cuando llego a 1,79.
        data_tests:
          - entre:
              arguments:
                minimo: 0.5
                maximo: 2.5

      - name: es_ultima_hora
        description: >
          La hora mas reciente que hay en la tabla. Existe porque el control de
          periodo de Data Studio ignora las unidades de tiempo y no puede filtrar
          "la ultima hora". Se calcula respecto al maximo de la tabla y no respecto a
          la hora actual: si la ingesta se para, esto sigue ensenando el ultimo dato
          bueno en lugar de dejar la pagina vacia, y la tarjeta de frescura avisa.
        data_tests: [not_null]

      - name: horas_de_antiguedad
        description: >
          Horas desde la hora mas reciente de la tabla. 0 es la ultima. Permite
          filtrar "las ultimas N horas" con un filtro numerico en el informe.
        data_tests: [not_null]
