[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rastro"
version = "0.1.0"
description = "Que se rompe si toco esta tabla: linaje e impacto para BigQuery y dbt"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guillermo Pereyra Lucero" }]
keywords = ["bigquery", "dbt", "linaje", "lineage", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]

# El nucleo no tiene dependencias a proposito: la ingesta usa `urllib` de la
# libreria estandar. Lo que necesita nube se instala aparte, para que quien
# solo quiera mirar un grafo no tenga que traerse medio SDK de Google.
dependencies = []

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rastro = "rastro.cli:main"

[project.urls]
Repositorio = "https://github.com/GuillermoPereyraLucero/rastro"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# `flowcrack/` es la herramienta de registro de decisiones, instalada tal cual
# desde su propio repositorio. No se reformatea codigo de terceros.
exclude = ["flowcrack"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
