--- # ---------------------------------------------------------------
# Rastro · registro de decisiones
# Formato FlowCrack v2. Vocabulario heredado del perfil `investigacion`,
# que a partir de aqui es tuyo: quitar carriles, anadir preguntas o
# reescribirlo entero es lo normal.
# ------------------------------------------------------------------
proyecto:
  nombre: Rastro
  perfil: investigacion
  seguimiento: ../docs/seguimiento.md
  publico: true

vocabulario:
  carriles:
    - id: pregunta
      nombre: Pregunta
      descripcion: Que se quiere averiguar y por que importa
    - id: metodo
      nombre: Metodo
      descripcion: Como se va a averiguar
    - id: fuentes
      nombre: Fuentes
      descripcion: Con que material se trabaja y de donde sale
    - id: analisis
      nombre: Analisis
      descripcion: Que se hace con el material
    - id: difusion
      nombre: Difusion
      descripcion: Donde y como se publica
    - id: etica
      nombre: Etica y permisos
      descripcion: Consentimientos, licencias, comites

  hitos:
    - id: pregunta-central
      pregunta: Cual es la pregunta que se responde?
    # Sustituye al `marco teorico` que traia el perfil `investigacion`: aqui
    # no se mira desde una teoria, se mide si la herramienta acierta.
    - id: evaluacion
      pregunta: Como se sabe que Rastro responde bien?
    - id: corpus
      pregunta: Con que material se trabaja?
    - id: metodo
      pregunta: Que metodo se emplea?
    - id: permisos
      pregunta: Que permisos o consentimientos hacen falta?
      irreversible: true
    - id: donde-se-publica
      pregunta: Donde se publica y bajo que licencia?
    - id: alcance-temporal
      pregunta: Que periodo o ambito cubre, y cual queda fuera?

  # Criterios de clasificacion. Son iguales en todos los perfiles: lo que
  # cambia de un proyecto a otro son los carriles y las preguntas, no la
  # forma de medir el impacto.
  impacto:
    pregunta: Si manana lo cambiamos, que hay que rehacer?
    valores:
      mayor:  Revertirla obliga a rehacer trabajo ya hecho en otras areas
      menor:  Revertirla afecta a trabajo no empezado, o queda en un solo carril
      parche: Revertirla no cambia nada de lo ya construido

  tipos:
    pregunta: Habia alternativas entre las que elegir?
    valores:
      decision:     Habia alternativas y se eligio una
      hallazgo:     No se eligio nada, se descubrio un hecho que cambio lo que sabiamos
      medicion:     Un hallazgo con cifra, obtenido midiendo
      hito-externo: Ocurre fuera del proyecto y no lo controlas

  irreversible:
    criterio: >
      Solo si al deshacerla se pierde algo que no se recupera: usuarios, dinero
      gastado, datos, una ventana temporal. "Seria incomodo" no cuenta: eso es
      impacto mayor.

decisiones:

  # === 25-sep · arranque del proyecto ================================

  - id: r001
    fecha: 2026-09-25
    orden: 1
    carril: etica
    titulo: "ESIOS es privado, BigQuery es publico: nada publico llama a la API"
    detalle: >
      Regla operativa: ESIOS -> (privado) -> BigQuery -> (publico) -> todo lo
      demas. El unico componente que habla con la API es el job de ingesta, que
      corre con el token, en el proyecto de Guillermo y sin exponerse.
    porque: >
      El correo del token trae una condicion explicita de REE: si el proyecto da
      acceso publico, los datos que devuelve la API deben servirse desde un
      servidor propio y no desde los sistemas de REE. No es una recomendacion,
      es lo que permite que el repo sea publico.
    consecuencia: >
      Ni el dashboard, ni el visor de Rastro, ni la capa de lenguaje natural
      pueden consultar ESIOS. Todos leen BigQuery.
    estado: vigente
    impacto: mayor
    irreversible: true
    hito: permisos
    alternativas:
      - opcion: Ingesta privada a BigQuery y todo lo publico leyendo de ahi
        elegida: true
        motivo: Cumple la condicion de REE y ademas es la arquitectura correcta
      - opcion: Que el dashboard consulte ESIOS en directo
        elegida: false
        motivo: Incumple la condicion del token y haria el proyecto impublicable

  - id: r002
    fecha: 2026-09-25
    orden: 2
    carril: etica
    titulo: Ingesta incremental con marca de agua, impuesta por REE
    detalle: >
      Marca de agua por indicador en una tabla de control. Los periodos cerrados
      no se vuelven a pedir nunca; solo se refresca la ventana de las ultimas
      horas. El catalogo se valida en local antes de salir a la red. Reintentos
      con espera exponencial y tope de peticiones por ejecucion.
    porque: >
      La segunda condicion de REE prohibe peticiones masivas, redundantes o
      innecesarias, y la tercera prohibe pedir indicadores inexistentes. Lo que
      en otro proyecto seria una buena practica opcional, aqui es requisito.
    consecuencia: >
      La ingesta incremental deja de ser un extra y pasa a ser el nucleo del
      diseno, que es justo lo que se espera de un senior y casi ningun
      portfolio hace.
    estado: vigente
    impacto: mayor
    hito: metodo
    alternativas:
      - opcion: Marca de agua por indicador y validacion local del catalogo
        elegida: true
        motivo: Cumple las dos condiciones y es lo que se pediria en produccion
      - opcion: Recarga completa en cada ejecucion
        elegida: false
        motivo: "Peticiones redundantes: prohibido por las condiciones del token"

  - id: r003
    fecha: 2026-09-25
    orden: 3
    carril: difusion
    titulo: El proyecto se llama Rastro
    porque: >
      Corto, dice lo que hace (seguir el rastro de un dato) y es distintivo en
      un ecosistema lleno de nombres en ingles. Cambiarlo hoy es gratis; en
      cuanto exista repo publico, paquete pip, comando y articulo, ya no.
    estado: vigente
    impacto: mayor
    alternativas:
      - opcion: Rastro
        elegida: true
        motivo: Corto, descriptivo y distintivo
      - opcion: Lineo
        elegida: false
        motivo: Mas literal pero se pierde entre los nombres genericos del sector
      - opcion: Trazo
        elegida: false
        motivo: Encaja con el visor, pero mas abstracto sobre que hace
      - opcion: Downstream
        elegida: false
        motivo: Termino generico del sector, invisible junto a dbt y OpenLineage

  - id: r004
    fecha: 2026-09-25
    orden: 4
    carril: difusion
    titulo: Repo publico desde el primer commit, con el registro de decisiones dentro
    detalle: >
      El repositorio git publico es la subcarpeta `rastro/`. La carpeta de
      trabajo `AI-Rastro/` no es un repo y nunca se inicializa como tal, porque
      contiene `notas/` con el token y contexto de una busqueda de empleo.
    porque: >
      El historial visible es parte del escaparate: se ve como se construyo, no
      solo el resultado. Y un registro de decisiones razonado dentro de un repo
      publico es exactamente lo que diferencia a este proyecto de los cien
      portfolios que un recruiter tecnico ya ha visto.
    consecuencia: >
      Tambien se ven los tropiezos. Se asume a cambio de que el proceso sea
      auditable.
    estado: vigente
    impacto: mayor
    irreversible: true
    hito: donde-se-publica
    alternativas:
      - opcion: Publico desde el commit 1 con FlowCrack dentro
        elegida: true
        motivo: El historial y el razonamiento son parte de lo que se ensena
      - opcion: Publico pero con el registro de decisiones en notas/
        elegida: false
        motivo: Se pierde el argumento mas diferenciador por miedo a los errores
      - opcion: Privado hasta tener algo presentable
        elegida: false
        motivo: Sin historial visible el repo vale lo mismo que un zip

  - id: r005
    fecha: 2026-09-25
    orden: 5
    carril: etica
    titulo: La herramienta previa del trabajo se usa como fuente de requisitos, nunca de codigo
    detalle: >
      De ella se toman ideas de diseno ya validadas contra 26 proyectos reales:
      bloque de metricas con reconciliacion, auditoria por objeto con motivo de
      exclusion, parseo de SQL en dos pasadas con respaldo por regex, y el
      visor de un solo fichero. No se copia codigo, ni identificadores de
      proyecto, ni nombres de tabla, ni la paleta corporativa del cliente.
    porque: >
      La idea de una herramienta de linaje no es de nadie (existen dbt docs,
      OpenLineage y Dataplex), pero una implementacion hecha para un cliente si
      lo es. Leerla para saber que preguntas importan y que falla no cruza esa
      linea; copiarla si.
    consecuencia: >
      En entrevista se puede decir sin ambiguedad: en el trabajo resolvi un
      problema parecido y lo adoptaron 48 personas; aqui esta mi propia version,
      publica y disenada desde cero.
    estado: vigente
    impacto: mayor
    irreversible: true
    hito: permisos
    alternativas:
      - opcion: Fuente de requisitos, no de codigo
        elegida: true
        motivo: Aprovecha la experiencia real sin tocar obra hecha para un cliente
      - opcion: No abrirla siquiera
        elegida: false
        motivo: >
          Renuncia a saber que preguntas importan y que falla, sin ganar nada: el
          riesgo esta en copiar, no en leer
      - opcion: Adaptar el codigo
        elegida: false
        motivo: Es obra hecha para un cliente y lleva dentro sus ids y sus tablas

  - id: r006
    fecha: 2026-09-25
    orden: 6
    carril: metodo
    titulo: En el portatil no hay gcloud, terraform, bq, docker, dbt ni jq
    tipo: hallazgo
    detalle: >
      Comprobado el 25-sep: solo estan Python 3.12.3 y git 2.38.1. El plan por
      semanas daba por instalado el tooling de nube.
    porque: >
      Se comprobo antes de asumirlo, siguiendo la regla de verificar antes de
      afirmar. Cambia el orden del plan: la semana 1 no puede empezar por
      Terraform.
    estado: vigente
    impacto: menor
    abre: [r007, r008]

  - id: r007
    fecha: 2026-09-25
    orden: 7
    carril: metodo
    titulo: Rastro se escribe en Python puro, no en bash con bq CLI y jq
    detalle: >
      Cliente `google-cloud-bigquery` en lugar del CLI `bq`, y `json` de la
      libreria estandar en lugar de `jq`. Empaquetado con pyproject, instalable
      con pip, con su comando de consola.
    porque: >
      Rastro es una herramienta pensada para que otros la adopten, y eso decide
      el lenguaje: en bash exige instalar el SDK de gcloud entero, se comporta
      distinto en Windows, no hay forma razonable de testearlo y no se
      distribuye por pip. En Python se instala con una orden, corre igual en los
      tres sistemas y los tests son triviales.
    consecuencia: >
      El CI puede ejecutar la suite de tests sin nube y sin credenciales.
    estado: vigente
    impacto: mayor
    hito: metodo
    causada_por: [r006]
    alternativas:
      - opcion: Python puro con google-cloud-bigquery
        elegida: true
        motivo: Instalable con pip, multiplataforma y testeable
      - opcion: Bash con bq CLI y jq
        elegida: false
        motivo: >
          Exige el SDK de gcloud completo, falla en Windows y no hay manera
          seria de testearlo ni de distribuirlo
      - opcion: Python llamando al CLI bq por debajo
        elegida: false
        motivo: Arrastra la dependencia del SDK sin ganar nada sobre el cliente

  - id: r008
    fecha: 2026-09-25
    orden: 8
    carril: metodo
    titulo: Se arranca por el cliente de ingesta en local, sin nube
    detalle: >
      Semana 1 reordenada: repo, registro de decisiones, cliente ESIOS con marca
      de agua y tests, todo en local. Terraform y BigQuery entran cuando el
      proyecto de GCP este completo y el tooling instalado.
    porque: >
      El cliente de ingesta y sus tests corren contra la API sin necesitar nube,
      asi que es lo unico del plan que avanza hoy. Ademas es donde vive la
      anomalia de datos que hay que resolver antes de modelar nada.
    estado: vigente
    impacto: menor
    causada_por: [r006]
    alternativas:
      - opcion: Ingesta en local primero
        elegida: true
        motivo: Avanza hoy sin instalar nada y desbloquea el modelado
      - opcion: Instalar gcloud y Terraform y seguir la semana 1 tal cual
        elegida: false
        motivo: La sesion se va en instalar y autenticar, sin nada que ensenar
      - opcion: Empezar por el nucleo de Rastro
        elegida: false
        motivo: Sin plataforma propia que analizar, el grafo es de juguete

  - id: r009
    fecha: 2026-09-25
    orden: 9
    carril: fuentes
    titulo: El proyecto de GCP se llama Rastro y esta a medias
    tipo: hito-externo
    detalle: >
      Existe el proyecto pero falta confirmar facturacion activada y la alerta
      de presupuesto a 1 EUR. Falta tambien el id real del proyecto, que no es
      el nombre visible.
    porque: >
      Sin facturacion activada no hay capa gratuita, y sin alerta de presupuesto
      no hay red de seguridad para un objetivo de coste de 0 EUR.
    estado: vigente
    impacto: menor

  - id: r010
    fecha: 2026-09-25
    orden: 10
    carril: pregunta
    titulo: "La pregunta que responde Rastro: que se rompe si toco esta tabla"
    detalle: >
      Cuatro preguntas concretas sobre el grafo de dependencias de BigQuery y
      dbt. De donde sale esta tabla (linaje aguas arriba, a traves de vistas
      anidadas). Que se rompe si la borro o le cambio una columna (radio de
      impacto aguas abajo). Que tablas no consulta nadie desde hace 90 dias
      (dinero en almacenamiento). Hay dependencias rotas o ciclos.
    porque: >
      Es la pregunta que nadie sabe responder en una plataforma de datos que ha
      crecido, y por eso nadie se atreve a borrar nada. Ademas se puede
      responder con consultas a INFORMATION_SCHEMA, que en BigQuery no se
      facturan: la herramienta cuesta cero euros ejecutarla.
    estado: vigente
    impacto: mayor
    hito: pregunta-central
    alternativas:
      - opcion: Una herramienta de linaje e impacto
        elegida: true
        motivo: >
          El 95% de los portfolios de datos son ingesta mas dashboard; una
          herramienta que otros adoptan es otra categoria
      - opcion: Un pipeline con dashboard
        elegida: false
        motivo: Un recruiter tecnico ya ha visto cien iguales

  - id: r011
    fecha: 2026-09-25
    orden: 11
    carril: fuentes
    titulo: El corpus son 16 indicadores de ESIOS a 5 minutos
    detalle: >
      Generacion en tiempo real por tecnologia (hidraulica, carbon, fuel-gas,
      nuclear, ciclo combinado, eolica, solar, solar termica, fotovoltaica,
      termica renovable, cogeneracion, intercambios y resto) mas demanda real,
      nacional y suma de generacion. Una sola zona geografica, la Peninsula
      (geo_id 8741). 288 puntos al dia por indicador.
    porque: >
      Son las series que cuentan la historia completa de un dia electrico
      espanol, y ademas es un sector que interesa a Guillermo: un proyecto
      sobre generacion renovable es conversacion con las empresas a las que
      quiere entrar.
    consecuencia: >
      4.608 filas al dia, unos 1,7 millones al ano. Cabe de sobra en los 10 GiB
      gratuitos de BigQuery y justifica particionar por fecha.
    estado: vigente
    impacto: mayor
    hito: corpus
    alternativas:
      - opcion: 16 indicadores de generacion y demanda peninsular
        elegida: true
        motivo: Cuentan un dia electrico completo sin inflar el volumen
      - opcion: Los 1.983 indicadores del catalogo
        elegida: false
        motivo: Peticiones masivas, prohibidas por las condiciones del token

  # === 25-sep · la anomalia del 37.483 ==============================

  - id: r012
    fecha: 2026-09-25
    orden: 12
    carril: analisis
    titulo: "time_trunc=hour de ESIOS suma las lecturas de 5 minutos, no las promedia"
    tipo: medicion
    detalle: >
      Comprobado con dos peticiones sobre el indicador 551 del 24-sep. Sin
      time_trunc la API devuelve 288 puntos al dia, uno cada 5 minutos. Con
      time_trunc=hour devuelve 24, y el valor de las 00:00Z es 32.307, que es
      la suma exacta de las doce lecturas de esa hora. La potencia eolica real
      de esa hora era 2.692 MW de media, plausible frente a los 32 GW
      instalados. Una sola zona geografica, asi que no habia doble conteo.
    porque: >
      El valor de 37.483 en unidad "Potencia" superaba la potencia eolica
      instalada en Espana. Un numero que contradice la realidad fisica no es un
      detalle de formato: es la senal de que no se sabe que se esta midiendo.
    consecuencia: >
      Sumar potencias instantaneas no produce ninguna magnitud util: no es
      potencia, y tampoco energia, porque para MWh habria que multiplicar cada
      lectura por su duracion antes de sumar. Escrito en docs/anomalia-generacion.md.
    estado: vigente
    impacto: mayor
    abre: [r013, r014]

  - id: r013
    fecha: 2026-09-25
    orden: 13
    carril: analisis
    titulo: La ingesta pide el dato crudo a 5 minutos y agrega en dbt
    detalle: >
      `ClienteESIOS.valores()` no manda `time_trunc` salvo que se le pida a
      proposito, y hay un test que lo fija.
    porque: >
      Delegar la agregacion en un parametro de la API cuyo criterio no esta
      documentado es exactamente como se llega a un 37.483 en un dashboard. En
      dbt el criterio esta escrito, versionado y probado.
    consecuencia: >
      Se ingiere 12 veces mas volumen, que sigue siendo trivial (1,7 M filas al
      ano), y a cambio la agregacion es auditable. Ademas una serie que cambia
      cada 5 minutos justifica de verdad el streaming.
    estado: vigente
    impacto: mayor
    hito: metodo
    causada_por: [r012]
    alternativas:
      - opcion: Ingerir crudo a 5 minutos y agregar en dbt
        elegida: true
        motivo: El criterio de agregacion queda escrito, versionado y probado
      - opcion: Dejar que ESIOS agregue con time_trunc
        elegida: false
        motivo: Suma lecturas instantaneas y produce una magnitud sin sentido
      - opcion: Agregar en el cliente de ingesta
        elegida: false
        motivo: Esconde el criterio en codigo Python en vez de en el modelo

  - id: r014
    fecha: 2026-09-25
    orden: 14
    carril: analisis
    titulo: El primer test de dbt es un rango plausible por tecnologia
    porque: >
      Un modelo que no sabe que la eolica no puede pasar de unos 32 GW aceptara
      cualquier cosa que le llegue. El test de rango es barato y habria cazado
      la anomalia el primer dia, sin necesidad de que alguien mirase el numero
      con desconfianza.
    estado: vigente
    impacto: menor
    causada_por: [r012]
    alternativas:
      - opcion: Rango plausible por tecnologia como primer test
        elegida: true
        motivo: Barato, y captura la clase de error que de verdad pasa
      - opcion: Empezar por tests de unicidad y no nulos
        elegida: false
        motivo: >
          Son los que trae todo el mundo y no habrian detectado nada: el dato
          era unico, no nulo y estaba mal

  - id: r015
    fecha: 2026-09-25
    orden: 15
    carril: metodo
    titulo: El nucleo del paquete se instala sin dependencias
    detalle: >
      La ingesta usa `urllib` de la libreria estandar. `google-cloud-bigquery`
      queda como extra opcional, en `pip install rastro[bigquery]`.
    porque: >
      Para una herramienta pensada para que otros la adopten, cada dependencia
      que no esta es una excusa menos para no instalarla. Quien solo quiera
      mirar un grafo no deberia tener que traerse medio SDK de Google.
    consecuencia: >
      La suite de tests corre en CI sin token, sin nube y sin credenciales,
      porque el transporte HTTP se inyecta.
    estado: vigente
    impacto: menor
    alternativas:
      - opcion: Nucleo sin dependencias, con urllib
        elegida: true
        motivo: Se instala en cualquier sitio y no arrastra nada
      - opcion: Usar requests
        elegida: false
        motivo: Mas comodo de escribir, pero es una dependencia por un GET
