# La suite entera corre sin token, sin nube y sin credenciales: el transporte
# HTTP se inyecta, asi que ningun test sale a la red. Eso es lo que permite
# ejecutarla en cada push sin consumir la cuota de un tercero.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Todos los extras. Los tests de la capa de BigQuery y los del pipeline de
      # streaming usan las librerias de verdad -con clientes y flujos falsos, pero las
      # clases son las reales-, asi que sin ellas el CI no prueba lo que dice probar.
      #
      # Se aprendio fallando: el CI instalaba solo `[dev]` y llevaba varios dias en
      # rojo mientras en local pasaba todo, porque en local si estaban instaladas.
      - name: Instalar
        run: pip install -e ".[dev,bigquery,grafo,streaming]"

      - name: Tests
        run: pytest

      - name: Estilo
        run: ruff check .

      - name: Que no se haya colado ningun secreto
        # Cinturon y tirantes sobre el .gitignore: si alguna vez entra un .env
        # o una clave de servicio, el CI se pone rojo antes que el repositorio
        # publique nada.
        run: |
          if git ls-files | grep -Ei '\.env$|credenciales|service-account.*\.json|-key\.json'; then
            echo "Hay un fichero que parece un secreto en el repositorio."
            exit 1
          fi
          echo "Sin secretos a la vista."

  terraform:
    runs-on: ubuntu-latest

    # Hace falta para que GitHub emita el token que se cambia por credenciales de
    # Google. Sin `id-token: write`, la federacion no tiene con que autenticarse.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Formato
        run: terraform -chdir=infra fmt -check -recursive

      # **Sin ninguna clave.** GitHub presenta el token de esta ejecucion y Google
      # devuelve credenciales temporales, validas solo para este repositorio y solo
      # para la cuenta de solo lectura `rastro-ci`.
      #
      # La alternativa -una clave de cuenta de servicio en los secretos- es un JSON
      # con acceso permanente que no caduca, funciona desde cualquier sitio y del que
      # nadie se acuerda hasta que aparece en un volcado.
      - name: Credenciales sin clave
        id: autenticar
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_CUENTA }}

      # Sin backend, para que `validate` funcione tambien en un fork, donde no hay
      # credenciales con las que abrir el estado remoto.
      - name: Init sin backend
        run: terraform -chdir=infra init -backend=false

      - name: Validar
        run: terraform -chdir=infra validate

      # `plan` solo si hubo credenciales. En un fork no las hay -y no debe haberlas-,
      # asi que ahi el trabajo se queda en formato y validacion en lugar de fallar por
      # algo que no es culpa de quien manda el cambio.
      #
      # `-reconfigure` porque el paso de arriba ya inicializo sin backend; sin el,
      # Terraform se niega a cambiar de sitio el estado a mitad de trabajo.
      #
      # `-lock=false` porque bloquear escribe un objeto en el bucket, y la cuenta del
      # CI es de solo lectura a proposito. Un `plan` no toca el estado, asi que dos a
      # la vez no pueden estorbarse.
      #
      # `-refresh=false` por dos motivos: los presupuestos cuelgan de la CUENTA DE
      # FACTURACION y no del proyecto, asi que una cuenta con `viewer` sobre el
      # proyecto no puede leerlos; y refrescar son decenas de llamadas a la API en
      # cada PR. Lo que este paso comprueba es que el cambio propuesto encaja con lo
      # que hay desplegado -no si alguien ha tocado algo por consola-.
      - name: Plan
        if: steps.autenticar.outcome == 'success'
        run: |
          terraform -chdir=infra init -input=false -reconfigure
          terraform -chdir=infra plan -input=false -no-color \
            -var="billing_account_id=${{ secrets.GCP_FACTURACION }}" \
            -var="correo_avisos=${{ secrets.GCP_CORREO_AVISOS }}" \
            -var="proyecto=${{ vars.GCP_PROYECTO }}" \
            -lock=false -refresh=false
        # **Las variables se pasan TODAS.** La primera version dejaba fuera
        # `correo_avisos`, y el plan anunciaba que destruiria el canal de avisos: una
        # destruccion que ningun `apply` real haria, porque ese valor vive en el
        # `terraform.tfvars` del portatil. Un plan que avisa de algo que no va a pasar
        # ensena a no leer los planes, que es peor que no tenerlo.

      - name: Sin credenciales, se avisa
        if: steps.autenticar.outcome != 'success'
        run: |
          echo "Sin credenciales federadas: solo se comprobo formato y validacion."
          echo "Es lo normal en un fork. En el repositorio original, revisar las"
          echo "variables WIF_PROVIDER, WIF_CUENTA y GCP_PROYECTO." 

  evaluacion:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install -e ".[dev,grafo]"

      # El banco se pasa contra el manifiesto de dbt que esta en el repositorio, sin
      # nube y sin credenciales. Una evaluacion que solo se puede ejecutar con acceso a
      # produccion acaba no ejecutandose.
      - name: Pasar el banco de preguntas
        run: |
          python -m rastro.cli evaluar \
            --grafo evals/grafo.json \
            --minimo-f2 0.95 \
            --detalle
